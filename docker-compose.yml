services:
  mongodb:
    image: mongo:7
    container_name: rag_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  chroma:
    image: chromadb/chroma:latest
    container_name: rag_chroma
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: rag_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag_api
    profiles: ["swagger"]
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - CHROMA_PATH=/data/chroma_db
      - MONGO_URI=mongodb://mongodb:27017
      - MINIO_ENDPOINT=minio:9000
    volumes:
      - chroma_db:/data/chroma_db
    depends_on:
      - mongodb
      - chroma
      - minio
    restart: unless-stopped

  telegram_bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag_telegram_bot
    profiles: ["telegram"]
    command: python -m telegram_bot.main
    env_file:
      - .env
    environment:
      - CHROMA_PATH=/data/chroma_db
      - MONGO_URI=mongodb://mongodb:27017
      - MINIO_ENDPOINT=minio:9000
    volumes:
      - chroma_db:/data/chroma_db
    depends_on:
      - mongodb
      - chroma
      - minio
    restart: unless-stopped

volumes:
  mongo_data:
  chroma_data:
  chroma_db:
  minio_data:
